# Production overrides (activate with SPRING_PROFILES_ACTIVE=prod). Everything not listed here is inherited.
# NOTE: you must add a real JDBC driver dependency (e.g. PostgreSQL) and a schema migration tool (Flyway/Liquibase);
# ddl-auto=validate expects the schema to exist.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  h2:
    console:
      enabled: false
  sql:
    init:
      mode: never

jwt:
  private-key:
    path: ${JWT_PRIVATE_KEY_PATH}     # e.g. file:/run/secrets/jwt-private.pem
  public-key:
    path: ${JWT_PUBLIC_KEY_PATH}

security:
  shared:
    gateway-secret: ${GATEWAY_SHARED_SECRET}      # no default in prod: startup fails if missing

app:
  security:
    cookie-secure: true

logging:
  level:
    com.crowdsource: INFO
