server:
  port: 8002

# ES256 signing keys. Any Spring resource location works (classpath:, file:). See PemKeyLoader for generation.
jwt:
  private-key:
    path: classpath:keys/private.pem
  public-key:
    path: classpath:keys/public.pem

spring:
  application:
    name: user-service

  # H2 Database (local dev only)
  datasource:
    url: jdbc:h2:mem:userdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false
    open-in-view: false
    defer-datasource-initialization: true   # run data.sql after Hibernate created the schema
  h2:
    console:
      enabled: true
      path: /h2-console

  sql:
    init:
      mode: always
      data-locations: classpath:data.sql

security:
  shared:
    gateway-secret: ${GATEWAY_SHARED_SECRET:dev-only-gateway-secret-change-me-0123456789}
    # Paths (as seen by this service, i.e. after the gateway's StripPrefix) that need no authentication
    public-paths:
      - /auth/v1/signup
      - /auth/v1/login
      - /auth/v1/refresh
      - /auth/v1/logout
      - /.well-known/jwks.json

app:
  security:
    jwt:
      issuer: ${JWT_ISSUER:crowdsource-user-service}     # must match the api-gateway
    cookie-secure: false          # true in the prod profile (HTTPS)
    cookie-same-site: Lax
    refresh-cookie-path: /api/auth/v1   # refresh cookie only travels to the auth endpoints

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.crowdsource: DEBUG
    org.springframework.security: INFO
