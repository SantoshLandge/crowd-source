server:
  port: 8003

spring:
  application:
    name: event-service

  datasource:
    url: jdbc:h2:mem:eventdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

  sql:
    init:
      mode: always

# No JWT handling here: the gateway validates the token and forwards HMAC-signed identity headers.
security:
  shared:
    gateway-secret: ${GATEWAY_SHARED_SECRET:dev-only-gateway-secret-change-me-0123456789}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never
