server:
  port: 8001

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          # CORS is configured in SecurityConfig (needed so preflight requests pass authentication).
          # The discovery locator is intentionally OFF: it would expose every service under /<service-id>/**
          # and bypass the path based RBAC rules below.
          routes:
            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=1        # /api/auth/v1/login -> /auth/v1/login

            - id: event-service
              uri: lb://EVENT-SERVICE
              predicates:
                - Path=/api/v1/event/**
              filters:
                - StripPrefix=1        # /api/v1/event/** -> /v1/event/**

            - id: registration-service
              uri: lb://REGISTRATION-SERVICE
              predicates:
                - Path=/api/v1/registration/**
              filters:
                - StripPrefix=1        # /api/v1/registration/** -> /v1/registration/**

            # payment-service is deliberately NOT routed: it is only called by registration-service.

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${USER_SERVICE_JWKS_URI:http://localhost:8002/.well-known/jwks.json}
          jws-algorithms: ES256

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    jwt:
      issuer: ${JWT_ISSUER:crowdsource-user-service}
    # Shared with every downstream service (security.shared.gateway-secret). MUST be overridden outside local dev.
    gateway-secret: ${GATEWAY_SHARED_SECRET:dev-only-gateway-secret-change-me-0123456789}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    fetch-registry: true
    register-with-eureka: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway
  endpoint:
    health:
      show-details: never        # /actuator/health is public, do not leak internals

logging:
  level:
    com.crowdsource.apigateway: DEBUG
    org.springframework.security: INFO
    org.springframework.cloud.gateway: INFO
    # Do NOT enable reactor.netty DEBUG/wiretap: it logs request headers, i.e. cookies and tokens.
